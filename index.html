<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js?v=4"></script>
<style>
/* Shadowing — same world as Word FC: night blue, one brand gradient, Poppins only.
   Colour carries meaning: blue = listen / action, green = your turn, red = recording. */
:root{
  --bg:#060A1A; --card:#0C1330; --card2:#111A3D; --line:rgba(195,206,255,.09); --line2:rgba(195,206,255,.16);
  --fg:#FFFFFF; --muted:#8490BA; --tint:#C3CEFF;
  --b1:#5577FF; --b2:#2140D8; --brand:#3D5CF5; --grad:linear-gradient(135deg,#5577FF 0%,#2140D8 100%);
  --good:#34D399; --bad:#FF5A72;
  --glass:rgba(8,12,32,.66);
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:460px;background:radial-gradient(70% 100% at 50% 0%,rgba(61,92,245,.20),rgba(61,92,245,0) 72%);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--tint);outline-offset:3px}
h1,h2,p{margin:0}
svg{display:block}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:calc(18px + var(--sat)) 20px 48px}
.screen{display:flex;flex-direction:column;gap:22px;animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.lab{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}

/* brand mark */
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.01em}
.tile{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tile svg{width:16px;height:16px;color:#fff}

/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;padding:0 22px;border-radius:18px;
  background:var(--grad);color:#fff;font-weight:600;font-size:16px;letter-spacing:.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 34px -14px rgba(61,92,245,.85);transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:rgba(195,206,255,.07);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- home ---------- */

.prog{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:transform .15s var(--ease)}
.prog:active{transform:scale(.985)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:rgba(195,206,255,.08)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.prog .t{min-width:0;flex:1}
.prog .t .lab{display:block}
.prog .t .nx{font-weight:600;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 10px 24px -10px rgba(61,92,245,.9)}
.go svg{width:18px;height:18px;color:#fff}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;background:rgba(195,206,255,.05);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:38px;border-radius:10px;font-weight:500;font-size:13.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(195,206,255,.12);color:var(--fg)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vc{position:relative;display:block;width:100%;aspect-ratio:3/4.1;border-radius:22px;overflow:hidden;text-align:left;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s var(--ease)}
.vc:active{transform:scale(.97)}
.vc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.vc img.ok{opacity:1}
.vc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,26,0) 40%,rgba(6,10,26,.92) 100%)}
.vc .n{position:absolute;z-index:1;top:10px;left:10px;height:24px;min-width:24px;padding:0 8px;border-radius:12px;background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.vc .dn{position:absolute;z-index:1;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--good);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(6,10,26,.5)}
.vc .dn svg{width:13px;height:13px;color:#06281B}
.vc .m{position:absolute;z-index:1;left:12px;right:12px;bottom:11px}
.vc .tt{display:-webkit-box;font-weight:600;font-size:13.5px;line-height:1.25;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .ss{display:block;font-size:11.5px;color:var(--tint);opacity:.75;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 0;font-size:14px}

/* ---------- player ---------- */
#player .wrap{padding-top:calc(10px + var(--sat))}
.stage{position:relative;border-radius:24px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px var(--line),0 24px 50px -24px rgba(0,0,0,.9)}
.stage video{display:block;width:100%;height:min(40vh,380px);object-fit:contain;background:#000}
.stage .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.stage .bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s linear}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head h2{font-size:18px;font-weight:600;line-height:1.25;min-width:0}
.head .cnt{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;flex:none}

.focus{position:relative;padding:22px 20px 18px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:center;min-height:168px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;transition:box-shadow .3s}
.focus.listen{box-shadow:inset 0 0 0 1.5px rgba(85,119,255,.55)}
.focus.say{box-shadow:inset 0 0 0 1.5px rgba(52,211,153,.55)}
.focus.rec{box-shadow:inset 0 0 0 1.5px rgba(255,90,114,.65)}
.phase{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phase i{width:7px;height:7px;border-radius:50%;background:currentColor}
.focus.listen .phase{color:var(--b1)} .focus.say .phase{color:var(--good)} .focus.rec .phase{color:var(--bad)}
.focus.rec .phase i,.focus.say.recording .phase i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.sent{font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.005em;cursor:pointer}
.meter{height:4px;border-radius:2px;background:rgba(195,206,255,.08);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:2px;background:var(--b1)}
.focus.say .meter i{background:var(--good)} .focus.rec .meter i{background:var(--bad)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:62px;padding:0 4px;border-radius:16px;font-size:11.5px;font-weight:500;line-height:1.15;white-space:nowrap;
  background:rgba(195,206,255,.07);box-shadow:inset 0 0 0 1px var(--line);color:var(--tint);transition:transform .15s var(--ease)}
.chip:active{transform:scale(.96)}
.chip svg{width:13px;height:13px}
.chip.you{background:rgba(52,211,153,.12);box-shadow:inset 0 0 0 1px rgba(52,211,153,.3);color:#9FEBCB}
.chip.re{background:rgba(255,90,114,.10);box-shadow:inset 0 0 0 1px rgba(255,90,114,.28);color:#FFB3BF}
.chip.re svg{width:12px;height:12px;color:var(--bad)}

.ctrl{display:flex;align-items:center;justify-content:center;gap:16px}
.cb{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:var(--tint);background:rgba(195,206,255,.05);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s var(--ease),background .2s,color .2s}
.cb:active{transform:scale(.94)}
.cb svg{width:22px;height:22px}
.main{width:76px;height:76px;border-radius:26px;display:grid;place-items:center;background:var(--grad);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 16px 36px -14px rgba(61,92,245,.95);transition:transform .15s var(--ease)}
.main:active{transform:scale(.95)}
.main svg{width:30px;height:30px}


.lst{display:flex;flex-direction:column;gap:2px}
.li{display:grid;grid-template-columns:26px 1fr 26px;gap:10px;align-items:start;padding:11px 12px;border-radius:14px;text-align:left;transition:background .2s}
.li .k{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums}
.li .x{font-size:14px;line-height:1.45;color:#C9D2F5}
.li .y{width:26px;height:26px;border-radius:50%;background:rgba(52,211,153,.16);box-shadow:inset 0 0 0 1px rgba(52,211,153,.3);display:grid;place-items:center;margin-top:-2px}
.li .y svg{width:10px;height:10px;color:var(--good);margin-left:1px}
.li.cur{background:rgba(61,92,245,.16);box-shadow:inset 0 0 0 1px rgba(85,119,255,.28)}
.li.cur .k{color:var(--tint)} .li.cur .x{color:#fff}

/* ---------- lock / loading ---------- */
.center{min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.badge{width:68px;height:68px;margin:0 auto;border-radius:22px;background:var(--grad);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px -16px rgba(61,92,245,.9)}
.badge svg{width:30px;height:30px;color:#fff}
.center h2{font-size:23px;font-weight:700;letter-spacing:-.01em}
.center p{color:var(--muted);font-size:14.5px;margin-top:6px}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-weight:600}
.ch .av{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--tint);font-size:14px;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.ch span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch svg{width:16px;height:16px;color:var(--muted)}
.spin{width:28px;height:28px;margin:0 auto;border-radius:50%;border:2.5px solid rgba(195,206,255,.14);border-top-color:var(--b1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:20;height:36px;display:flex;align-items:center;padding:0 16px;border-radius:18px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;font-weight:500;white-space:nowrap;animation:fade .3s var(--ease)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5577FF"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs></svg>

<section id="loading"><div class="wrap"><div class="center"><div class="spin"></div></div></div></section>

<section id="gate" hidden><div class="wrap"><div class="center screen">
  <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></div>
  <div><h2>Shadowing</h2><p>Bu sahifa faqat Telegram bot orqali ochiladi.</p></div>
</div></div></section>

<section id="lock" hidden><div class="wrap"><div class="center screen">
  <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
  <div><h2>Shadowing yopiq</h2><p>Ochish uchun ustozlar kanaliga a'zo bo'ling</p></div>
  <div class="chs" id="lockChannels"></div>
  <button class="btn" id="recheckBtn"><span id="recheckLbl">A'zo bo'ldim</span></button>
</div></div></section>

<section id="home" hidden><div class="wrap screen">
  <div class="mark"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></div>Shadowing</div>
  <button class="prog" id="cont">
    <div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="ringFg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><b id="ringTxt">0</b></div>
    <div class="t"><span class="lab" id="contLab">Boshlash</span><div class="nx" id="contName"></div></div>
    <div class="go"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg></div>
  </button>
  <div class="seg" id="filter">
    <button aria-pressed="true" data-f="all">Hammasi</button>
    <button aria-pressed="false" data-f="left">Qolgan</button>
    <button aria-pressed="false" data-f="done">Tugatilgan</button>
  </div>
  <div class="grid" id="grid"></div>
</div></section>

<section id="player" hidden><div class="wrap screen">
  <div class="stage"><video id="video" playsinline webkit-playsinline preload="auto"></video><div class="bar"><i id="vbar"></i></div></div>
  <div class="head"><h2 id="ptitle"></h2><span class="cnt" id="pcount"></span></div>

  <div class="focus" id="focus">
    <div class="phase"><i></i><span id="phaseTxt">Tayyor</span></div>
    <div class="sent" id="sent"></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="cmp" id="cmp" hidden>
      <button class="chip" id="cmpOrig"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg><span>Asl ovoz</span></button>
      <button class="chip you" id="cmpYou"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg><span>Mening ovozim</span></button>
      <button class="chip re" id="cmpRe"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg><span>Qayta yozish</span></button>
    </div>
  </div>

  <div class="ctrl">
    <button class="cb" id="prevBtn" aria-label="Oldingi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.9v12.2a.9.9 0 0 1-1.4.75L10 12.75a.9.9 0 0 1 0-1.5l8.6-6.1A.9.9 0 0 1 20 5.9z"/></svg></button>
    <button class="main" id="mainBtn" aria-label="Boshlash"><svg id="mainIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg></button>
    <button class="cb" id="nextBtn" aria-label="Keyingi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.9v12.2a.9.9 0 0 0 1.4.75L14 12.75a.9.9 0 0 0 0-1.5L5.4 5.15A.9.9 0 0 0 4 5.9z"/></svg></button>
  </div>

  <div class="seg" id="speedSeg"><button data-s="0.75" aria-pressed="false">Sekin · 0.75×</button><button data-s="1" aria-pressed="true">Oddiy · 1×</button></div>

  <div class="lst" id="lst"></div>

  <button class="btn ghost" id="doneBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="doneLbl">Tugatdim</span></button>
</div></section>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const VIDEOS = window.VIDEOS || [];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  const ICO = {
    play: '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/>',
    pause: '<rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
    arrow: '<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  };

  // ---------- open only inside Telegram ----------
  if (!tg || !tg.initData) { $("loading").hidden = true; $("gate").hidden = false; return; }
  tg.ready(); tg.expand();
  try { if (tg.requestFullscreen && !tg.isFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.requestFullscreen(); } catch (e) {}
  try { tg.setHeaderColor("#060A1A"); tg.setBackgroundColor("#060A1A"); tg.setBottomBarColor && tg.setBottomBarColor("#060A1A"); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  const haptic = (t) => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
  const notify = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
  function toast(msg) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
    document.body.appendChild(d); setTimeout(() => d.remove(), 2400);
  }

  // ---------- progress (Telegram cloud + this phone) ----------
  let done = {};
  try { done = JSON.parse(localStorage.getItem("shadow_done") || "{}"); } catch (e) {}
  function saveDone() {
    const s = JSON.stringify(done);
    try { localStorage.setItem("shadow_done", s); } catch (e) {}
    try { tg.CloudStorage && tg.CloudStorage.setItem("shadow_done", s); } catch (e) {}
  }
  try {
    tg.CloudStorage && tg.CloudStorage.getItem("shadow_done", (err, val) => {
      if (!err && val) { try { Object.assign(done, JSON.parse(val)); if (!$("home").hidden) renderHome(); } catch (e) {} }
    });
  } catch (e) {}

  // ---------- screens ----------
  const SCREENS = ["loading", "gate", "lock", "home", "player"];
  function show(id) {
    SCREENS.forEach(s => $(s).hidden = s !== id);
    window.scrollTo(0, 0);
    if (id === "player") tg.BackButton.show(); else tg.BackButton.hide();
  }

  // ---------- home ----------
  let filter = "all";
  function nextVideo() { return VIDEOS.find(v => !done[v.id]) || VIDEOS[0]; }
  function renderHome() {
    const n = VIDEOS.filter(v => done[v.id]).length;
    $("ringTxt").textContent = `${n}/${VIDEOS.length}`;
    $("ringFg").style.strokeDashoffset = 169.6 * (1 - (VIDEOS.length ? n / VIDEOS.length : 0));
    const nx = nextVideo();
    $("contLab").textContent = n === 0 ? "Birinchi videodan boshlang" : (n === VIDEOS.length ? "Hammasi tugatildi — qaytadan" : "Davom etish");
    $("contName").textContent = nx ? nx.title : "";
    const list = VIDEOS.map((v, i) => ({ v, i })).filter(({ v }) =>
      filter === "all" || (filter === "done" ? done[v.id] : !done[v.id]));
    $("grid").innerHTML = list.length ? list.map(({ v, i }) => `
      <button class="vc" data-id="${v.id}">
        <img src="posters/${v.id}.jpg" alt="" loading="lazy" onload="this.classList.add('ok')">
        ${done[v.id] ? `<span class="dn"><svg viewBox="0 0 24 24">${ICO.check}</svg></span>` : ""}
        <span class="m"><span class="tt">${esc(v.title)}</span><span class="ss">${fmt(v.dur)} · ${v.segs.length} gap</span></span>
      </button>`).join("")
      : `<div class="empty">${filter === "done" ? "Hali tugatilgan video yo'q" : "Barcha videolar tugatildi"}</div>`;
  }
  $("grid").addEventListener("click", (e) => { const b = e.target.closest(".vc"); if (b) { haptic(); openVideo(b.dataset.id); } });
  $("cont").onclick = () => { haptic("medium"); const v = nextVideo(); if (v) openVideo(v.id); };
  $("filter").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f; haptic();
    $("filter").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderHome();
  });

  // ---------- player state ----------
  const video = $("video");
  let cur = null, idx = 0, speed = 1, running = false;
  let runId = 0;              // every new action cancels the previous one
  const myRec = {};           // sentence -> your recording (this visit only)

  tg.BackButton.onClick(() => {
    stopAll(); video.pause(); video.removeAttribute("src"); video.load();
    show("home"); renderHome();
  });

  function openVideo(id) {
    cur = VIDEOS.find(v => v.id === id); idx = 0;
    Object.keys(myRec).forEach(k => { URL.revokeObjectURL(myRec[k]); delete myRec[k]; });
    $("ptitle").textContent = cur.title;
    video.src = `videos/${cur.id}.mp4`; video.poster = `posters/${cur.id}.jpg`;
    video.playbackRate = speed; $("vbar").style.width = "0";
    renderList(); renderFocus(); setPhase("", "Tayyor"); setMeter(0); setMain(false);
    $("doneLbl").textContent = done[cur.id] ? "Tugatilgan" : "Tugatdim";
    show("player");
  }
  video.addEventListener("timeupdate", () => {
    if (cur && video.duration) $("vbar").style.width = (100 * video.currentTime / video.duration) + "%";
  });

  function renderFocus() {
    const s = cur.segs[idx];
    $("sent").textContent = s.t;
    $("pcount").textContent = `${idx + 1} / ${cur.segs.length}`;
    $("cmp").hidden = !myRec[idx];
    document.querySelectorAll(".li").forEach(r => r.classList.toggle("cur", +r.dataset.i === idx));
  }
  function renderList() {
    $("lst").innerHTML = cur.segs.map((s, i) => `
      <button class="li ${i === idx ? "cur" : ""}" data-i="${i}">
        <span class="k">${String(i + 1).padStart(2, "0")}</span>
        <span class="x">${esc(s.t)}</span>
        ${myRec[i] ? `<span class="y" data-mine="${i}" title="Mening ovozim"><svg viewBox="0 0 24 24" fill="currentColor">${ICO.play}</svg></span>` : "<span></span>"}
      </button>`).join("");
  }
  $("lst").addEventListener("click", (e) => {
    const r = e.target.closest(".li"); if (!r) return;
    const mine = e.target.closest("[data-mine]");
    idx = +r.dataset.i; renderFocus(); haptic();
    if (mine) { stopAll(); const my = runId; setPhase("say", "Sizning ovozingiz"); playMine(idx, my).then(() => { if (my === runId) setPhase("", "Tayyor"); }); return; }
    window.scrollTo({ top: 0, behavior: "smooth" });
    playOne();
  });
  $("sent").onclick = () => playOne();

  function setPhase(kind, label) { $("focus").className = "focus " + kind; $("phaseTxt").textContent = label; }
  function setMeter(p) { $("meter").style.width = (Math.max(0, Math.min(1, p)) * 100) + "%"; }
  function setMain(isRunning) { running = isRunning; $("mainIco").innerHTML = isRunning ? ICO.pause : ICO.play; }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const segLen = (i) => (cur.segs[i].e - cur.segs[i].s) / speed;

  async function countdown(ms, my) {
    const t0 = performance.now();
    while (performance.now() - t0 < ms) {
      if (my !== runId) return false;
      setMeter((performance.now() - t0) / ms); await sleep(40);
    }
    setMeter(1); return my === runId;
  }

  // plays one sentence; resolves true when it ends, false if cancelled
  function playSegment(i, my) {
    return new Promise(async (resolve) => {
      const s = cur.segs[i];
      video.playbackRate = speed;
      if (Math.abs(video.currentTime - s.s) > 0.05) {
        await new Promise(r => {
          const t = setTimeout(r, 1500);
          video.addEventListener("seeked", () => { clearTimeout(t); r(); }, { once: true });
          video.currentTime = s.s;
        });
      }
      if (my !== runId) { resolve(false); return; }
      try { await video.play(); } catch (e) { resolve(false); return; }
      const tick = () => {
        if (my !== runId) { resolve(false); return; }
        if (video.currentTime >= s.e - 0.03 || video.ended) { video.pause(); setMeter(1); resolve(true); return; }
        setMeter((video.currentTime - s.s) / (s.e - s.s));
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  function stopAll() {
    runId++; video.pause(); setMain(false);
    if (recorder && recorder.state !== "inactive") { try { recorder.stop(); } catch (e) {} }
    if (cur) { setPhase("", "Tayyor"); setMeter(0); }
  }

  // one sentence (tap the sentence or a line in the list)
  async function playOne() {
    stopAll(); const my = runId;
    setPhase("listen", "Tinglang");
    if (await playSegment(idx, my)) setPhase("", "Tayyor");
  }

  // main flow: listen -> repeat aloud -> next sentence
  async function practice() {
    stopAll(); const my = runId; setMain(true); haptic("medium");
    let mic = null;
    try { mic = typeof MediaRecorder !== "undefined" ? await getMic() : null; }
    catch (e) { toast("Mikrofonga ruxsat berilmadi — yozmasdan davom etamiz"); }
    if (my !== runId) return;
    for (let i = idx; i < cur.segs.length; i++) {
      idx = i; renderFocus();
      setPhase("listen", "Tinglang");
      if (!await playSegment(i, my)) return;
      haptic("soft");
      if (!await yourTurn(i, mic, my)) return;
    }
    if (my !== runId) return;
    stopAll(); idx = 0; renderFocus();
    finish(true);
  }
  $("mainBtn").onclick = () => { if (running) { stopAll(); haptic(); } else practice(); };
  $("prevBtn").onclick = () => { if (idx > 0) { idx--; renderFocus(); haptic(); playOne(); } };
  $("nextBtn").onclick = () => { if (idx < cur.segs.length - 1) { idx++; renderFocus(); haptic(); playOne(); } };

  // ---------- your turn: repeat aloud (recorded automatically) ----------
  let stream = null, recorder = null;
  async function yourTurn(i, mic, my) {
    const ms = segLen(i) * 1250 + 900;
    // already recorded: just pause for them to repeat (only "Qayta yozish" records again)
    if (!mic || myRec[i]) { setPhase("say", "Endi siz takrorlang"); return countdown(ms, my); }
    return recordInto(i, mic, ms, my, "say recording", "Endi siz takrorlang");
  }
  async function recordInto(i, mic, ms, my, kind, label) {
    const chunks = [];
    recorder = new MediaRecorder(mic);
    recorder.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
    const stopped = new Promise(r => recorder.onstop = r);
    recorder.start();
    setPhase(kind, label);
    const ok = await countdown(ms, my);
    if (recorder.state !== "inactive") recorder.stop();
    await stopped;
    if (!ok) return false;
    if (chunks.length) {
      if (myRec[i]) URL.revokeObjectURL(myRec[i]);
      myRec[i] = URL.createObjectURL(new Blob(chunks, { type: chunks[0].type || "audio/mp4" }));
      recVersion++;
      const row = document.querySelector(`.li[data-i="${i}"] span:last-child`);
      if (row) row.outerHTML = `<span class="y" data-mine="${i}" title="Mening ovozim"><svg viewBox="0 0 24 24" fill="currentColor">${ICO.play}</svg></span>`;
      if (i === idx) $("cmp").hidden = false;
    }
    return true;
  }
  async function getMic() {
    if (stream && stream.active) return stream;
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    return stream;
  }
  function playMine(i, my) {
    return new Promise((resolve) => {
      const a = new Audio(myRec[i]);
      a.onended = () => resolve(true); a.onerror = () => resolve(false);
      a.play().catch(() => resolve(false));
      const tick = () => {
        if (my !== runId) { a.pause(); resolve(false); return; }
        if (a.duration && isFinite(a.duration)) setMeter(a.currentTime / a.duration);
        if (!a.ended) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  $("cmpOrig").onclick = async () => { stopAll(); const my = runId; setPhase("listen", "Asl ovoz"); if (await playSegment(idx, my)) setPhase("", "Solishtiring"); };
  $("cmpRe").onclick = async () => {
    stopAll(); const my = runId; haptic("medium");
    let mic;
    try { mic = await getMic(); } catch (e) { toast("Mikrofonga ruxsat bering"); return; }
    if (my !== runId) return;
    if (await recordInto(idx, mic, segLen(idx) * 1250 + 900, my, "rec", "Yozilmoqda — gapiring")) {
      notify("success"); setPhase("", "Yangi yozuv saqlandi");
    }
  };
  $("cmpYou").onclick = async () => { stopAll(); const my = runId; setPhase("say", "Sizning ovozingiz"); await playMine(idx, my); if (my === runId) setPhase("", "Solishtiring"); };

  // ---------- options ----------
  $("speedSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    speed = +b.dataset.s; video.playbackRate = speed; haptic();
    $("speedSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });

  // ---------- finished ----------
  function finish(auto) {
    if (!done[cur.id]) { done[cur.id] = Date.now(); saveDone(); }
    $("doneLbl").textContent = "Tugatilgan";
    notify("success");
    toast(auto ? "Barakalla! Video tugatildi" : "Tugatildi deb belgilandi");
    sendVoices(cur);
  }

  // ---------- send the student's voice for this video (one file) to the teacher ----------
  const SUBMIT_URL = "https://admin-panel-production-65f6.up.railway.app/shadowing/submit";
  const LAME_URL = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
  const RATE = 22050;
  let recVersion = 0;                 // goes up with every new recording
  const sentVersion = {};             // video -> recVersion already sent
  function loadLame() {
    return new Promise((res) => {
      if (window.lamejs) return res(true);
      const sc = document.createElement("script"); sc.src = LAME_URL;
      sc.onload = () => res(!!window.lamejs); sc.onerror = () => res(false);
      document.head.appendChild(sc); setTimeout(() => res(!!window.lamejs), 8000);
    });
  }
  async function toMono(blobUrl, ctx) {
    const buf = await (await fetch(blobUrl)).arrayBuffer();
    const audio = await new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad));
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const off = new Off(1, Math.max(1, Math.ceil(audio.duration * RATE)), RATE);
    const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start(0);
    const out = await new Promise((ok) => { const p = off.startRendering(); if (p && p.then) p.then(ok); else off.oncomplete = (e) => ok(e.renderedBuffer); });
    return out.getChannelData(0);
  }
  function toInt16(f32) {
    const o = new Int16Array(f32.length);
    for (let k = 0; k < f32.length; k++) { const v = Math.max(-1, Math.min(1, f32[k])); o[k] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
    return o;
  }
  function wavBlob(pcm) {
    const b = new ArrayBuffer(44 + pcm.length * 2), d = new DataView(b);
    const w = (o, str) => { for (let k = 0; k < str.length; k++) d.setUint8(o + k, str.charCodeAt(k)); };
    w(0, "RIFF"); d.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
    d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, RATE, true);
    d.setUint32(28, RATE * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, pcm.length * 2, true);
    new Int16Array(b, 44).set(pcm);
    return new Blob([b], { type: "audio/wav" });
  }
  function mp3Blob(pcm) {
    const enc = new lamejs.Mp3Encoder(1, RATE, 64), out = [];
    for (let k = 0; k < pcm.length; k += 1152) { const m = enc.encodeBuffer(pcm.subarray(k, k + 1152)); if (m.length) out.push(new Uint8Array(m)); }
    const end = enc.flush(); if (end.length) out.push(new Uint8Array(end));
    return new Blob(out, { type: "audio/mpeg" });
  }
  async function sendVoices(v) {
    const ids = Object.keys(myRec).map(Number).sort((a, b) => a - b);
    if (!ids.length || sentVersion[v.id] === recVersion) return;
    const version = recVersion;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const parts = [];
      for (const i of ids) parts.push(await toMono(myRec[i], ctx));
      try { ctx.close(); } catch (e) {}
      const gap = Math.round(RATE * 0.7);
      const all = new Float32Array(parts.reduce((n, p) => n + p.length + gap, 0));
      let at = 0; for (const p of parts) { all.set(p, at); at += p.length + gap; }
      const pcm = toInt16(all);
      const mp3 = await loadLame();
      let blob;
      try { blob = mp3 ? mp3Blob(pcm) : wavBlob(pcm); } catch (e) { blob = wavBlob(pcm); }
      const q = new URLSearchParams({ video: v.id, title: v.title, n: ids.length, total: v.segs.length });
      const r = await fetch(`${SUBMIT_URL}?${q}`, {
        method: "POST", headers: { "Content-Type": blob.type, "X-Init-Data": tg.initData }, body: blob,
      });
      if (r.ok) { sentVersion[v.id] = version; toast("Ovozingiz ustozga yuborildi"); }
      else toast("Ovozingizni yuborib bo'lmadi");
    } catch (e) {
      toast("Ovozingizni yuborib bo'lmadi");
    }
  }
  $("doneBtn").onclick = () => finish(false);

  // ---------- only for people in both required channels ----------
  const ACCESS_URL = "https://admin-panel-production-65f6.up.railway.app/shadowing/access";
  let unlocked = false;
  async function checkAccess() {
    try {
      const r = await fetch(ACCESS_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData }),
      });
      return await r.json();
    } catch (e) {
      return { ok: true };   // our server can't be reached: don't punish members
    }
  }
  function showLock(channels) {
    stopAll(); video.pause();
    $("lockChannels").innerHTML = (channels || []).map(c => `
      <button class="ch" data-url="${esc(c.url)}"><span class="av">${esc((c.name.trim()[0] || "•").toUpperCase())}</span><span>${esc(c.name)}</span><svg viewBox="0 0 24 24">${ICO.arrow}</svg></button>`).join("");
    show("lock");
  }
  $("lockChannels").addEventListener("click", (e) => {
    const b = e.target.closest(".ch"); if (b) { haptic(); tg.openTelegramLink(b.dataset.url); }
  });
  async function gate() {
    const res = await checkAccess();
    if (res.ok) {
      if (!unlocked) { unlocked = true; show("home"); renderHome(); }
    } else {
      unlocked = false; showLock(res.channels);
    }
    return res.ok;
  }
  $("recheckBtn").onclick = async () => {
    haptic("medium"); $("recheckLbl").textContent = "Tekshirilmoqda…";
    const ok = await gate();
    $("recheckLbl").textContent = "A'zo bo'ldim";
    if (!ok) { notify("error"); toast("Hali hamma kanallarga a'zo emassiz"); } else notify("success");
  };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) gate(); });
  gate();
})();
</script>
</body>
